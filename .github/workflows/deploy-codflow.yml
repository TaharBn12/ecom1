name: Deploy CodFlow to Cloudflare

on:
  workflow_dispatch:
    inputs:
      project_prefix:
        description: 'Project prefix (e.g. codflow, mystore)'
        required: true
        default: 'codflow'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0a98e-ecom1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check Cloudflare auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler whoami
          echo "Auth OK"

      - name: Create and Bind Cloudflare Resources
        id: create_resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PROJECT=${{ inputs.project_prefix }}
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "PROJECT=$PROJECT"
          
          echo "=== Creating D1 ${PROJECT}-db ==="
          npx wrangler d1 create ${PROJECT}-db 2>&1 || echo "D1 may already exist"
          
          echo "=== Creating R2 ${PROJECT}-images ==="
          npx wrangler r2 bucket create ${PROJECT}-images 2>&1 || echo "R2 may already exist"
          
          echo "=== Creating KV RATE_LIMIT ==="
          npx wrangler kv namespace create RATE_LIMIT 2>&1 || true
          
          echo "=== Creating KV OAUTH_KV ==="
          npx wrangler kv namespace create OAUTH_KV 2>&1 || true
          
          echo "=== Listing resources ==="
          npx wrangler d1 list
          npx wrangler kv namespace list
          
          # Get real IDs
          echo "=== Fetching real IDs ==="
          D1_JSON=$(npx wrangler d1 list --json 2>/dev/null || echo "[]")
          echo "$D1_JSON" | jq .
          D1_ID=$(echo "$D1_JSON" | jq -r --arg name "${PROJECT}-db" '.[] | select(.name==$name) | .uuid' | head -n1)
          if [ -z "$D1_ID" ]; then
            D1_ID=$(echo "$D1_JSON" | jq -r '.[0].uuid' | head -n1)
          fi
          echo "D1_ID=$D1_ID"
          echo "D1_ID=$D1_ID" >> $GITHUB_ENV
          
          KV_JSON=$(npx wrangler kv namespace list --json 2>/dev/null || npx wrangler kv namespace list 2>&1)
          echo "$KV_JSON" | head -n 100
          # Try to parse KV ids - they are in format id + title
          # Use wrangler kv namespace list and grep
          KV_RATE_ID=$(npx wrangler kv namespace list 2>&1 | grep -A1 "RATE_LIMIT" | grep -oE "[a-f0-9]{32}" | head -n1 || echo "")
          KV_OAUTH_ID=$(npx wrangler kv namespace list 2>&1 | grep -A1 "OAUTH_KV" | grep -oE "[a-f0-9]{32}" | head -n1 || echo "")
          # Fallback: get any two KV ids
          if [ -z "$KV_RATE_ID" ]; then
            KV_RATE_ID=$(npx wrangler kv namespace list 2>&1 | grep -oE "[a-f0-9]{32}" | head -n1)
          fi
          if [ -z "$KV_OAUTH_ID" ]; then
            KV_OAUTH_ID=$(npx wrangler kv namespace list 2>&1 | grep -oE "[a-f0-9]{32}" | sed -n '2p')
          fi
          echo "KV_RATE_ID=$KV_RATE_ID"
          echo "KV_OAUTH_ID=$KV_OAUTH_ID"
          echo "KV_RATE_ID=$KV_RATE_ID" >> $GITHUB_ENV
          echo "KV_OAUTH_ID=$KV_OAUTH_ID" >> $GITHUB_ENV
          
          # Rewrite wrangler.toml files with real IDs
          echo "=== Rewriting wrangler.toml with real IDs ==="
          # cod-server
          if [ -n "$D1_ID" ]; then
            sed -i "s/00000000-0000-0000-0000-000000000000/$D1_ID/g" cod-server/wrangler.toml || true
            # Also replace any UUID placeholder pattern
            sed -i "s/d9fd263d-ac3c-4075-ad82-5fc58420ce39/$D1_ID/g" cod-server/wrangler.toml || true
            sed -i "s/eddf62d4-6fd9-4013-b374-6d387b67bb0c/$D1_ID/g" cod-server/wrangler.toml || true
          fi
          if [ -n "$KV_RATE_ID" ]; then
            # Replace first KV placeholder
            sed -i "0,/30b8f0efac83e176c5688731eb29ce3d/s//${KV_RATE_ID}/" cod-server/wrangler.toml || true
            sed -i "s/30b8f0efac83e176c5688731eb29ce3d/${KV_RATE_ID}/g" cod-server/wrangler.toml || true
          fi
          if [ -n "$KV_OAUTH_ID" ]; then
            sed -i "s/86f0c3fcb8426dbd47a223dee6384a99/${KV_OAUTH_ID}/g" cod-server/wrangler.toml || true
          fi
          
          # cod-client-astro
          if [ -n "$D1_ID" ]; then
            sed -i "s/d9fd263d-ac3c-4075-ad82-5fc58420ce39/$D1_ID/g" cod-client-astro/wrangler.toml || true
            sed -i "s/<your-d1-database-id>/$D1_ID/g" cod-client-astro/wrangler.toml || true
          fi
          if [ -n "$KV_RATE_ID" ]; then
            sed -i "s/52323408a1a8e53f0b5df93ed5391620/${KV_RATE_ID}/g" cod-client-astro/wrangler.toml || true
            sed -i "s/<your-kv-namespace-id>/${KV_RATE_ID}/g" cod-client-astro/wrangler.toml || true
          fi
          
          echo "=== Updated cod-server/wrangler.toml ==="
          grep -E "database_id|RATE_LIMIT|OAUTH_KV|id =" cod-server/wrangler.toml | head -n 20
          echo "=== Updated cod-client-astro/wrangler.toml ==="
          cat cod-client-astro/wrangler.toml
          
          # Create .env for scripts
          cat > .env <<EOF
          COD_DB_NAME=${PROJECT}-db
          COD_R2_BUCKET_NAME=${PROJECT}-images
          COD_SERVER_URL=https://${PROJECT}-server.workers.dev
          COD_MEDIA_DOMAIN=media.example.com
          EOF
          cat .env

      - name: Generate Secrets
        id: secrets
        run: |
          BETTER_AUTH_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          STORE_API_KEY=$(node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))")
          MCP_LOGIN_TICKET_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET" >> $GITHUB_ENV
          echo "STORE_API_KEY=$STORE_API_KEY" >> $GITHUB_ENV
          echo "MCP_LOGIN_TICKET_SECRET=$MCP_LOGIN_TICKET_SECRET" >> $GITHUB_ENV
          # Save for later steps output (masked)
          echo "::add-mask::$BETTER_AUTH_SECRET"
          echo "::add-mask::$STORE_API_KEY"
          echo "::add-mask::$MCP_LOGIN_TICKET_SECRET"
          echo "Generated secrets"

      - name: Migrate D1 Remote (Robust - Fix for fresh DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cod-server
          export COD_DB_NAME=${{ env.PROJECT }}-db
          echo "=== DB: $COD_DB_NAME ==="
          
          echo "=== Step 0: Create d1_migrations table manually (fixes SQLITE_ERROR 7500) ==="
          npx wrangler d1 execute $COD_DB_NAME --remote --command "CREATE TABLE IF NOT EXISTS d1_migrations (id TEXT PRIMARY KEY, name TEXT, applied_at TEXT DEFAULT CURRENT_TIMESTAMP);" 2>&1 || true
          
          echo "=== Step 1: Check current tables ==="
          npx wrangler d1 execute $COD_DB_NAME --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" 2>&1 || true
          
          echo "=== Step 2: Try wrangler migrations apply (may fail first time) ==="
          npx wrangler d1 migrations apply $COD_DB_NAME --remote 2>&1 || echo "First migrations apply failed, continuing to manual method"
          
          echo "=== Step 3: Execute 0000_complete.sql directly via D1 ==="
          # Split 0000_complete.sql by statement-breakpoint and execute in batches if needed
          # Try direct file execution first
          npx wrangler d1 execute $COD_DB_NAME --remote --file=src/db/migrations/0000_complete.sql 2>&1 | tail -n 100 || true
          
          echo "=== Step 4: Execute remaining migrations one by one via file ==="
          for f in src/db/migrations/0001_*.sql src/db/migrations/0002_*.sql src/db/migrations/0003_*.sql src/db/migrations/0004_*.sql src/db/migrations/0005_*.sql src/db/migrations/0006_*.sql src/db/migrations/0007_*.sql src/db/migrations/0008_*.sql src/db/migrations/0009_*.sql src/db/migrations/0010_*.sql src/db/migrations/0011_*.sql src/db/migrations/0012_*.sql src/db/migrations/0013_*.sql src/db/migrations/0014_*.sql src/db/migrations/0015_*.sql src/db/migrations/0016_*.sql src/db/migrations/0017_*.sql src/db/migrations/0018_*.sql src/db/migrations/0019_*.sql src/db/migrations/0020_*.sql src/db/migrations/0021_*.sql src/db/migrations/0022_*.sql src/db/migrations/0023_*.sql src/db/migrations/0024_*.sql; do
            if [ -f "$f" ]; then
              echo "Applying $f..."
              npx wrangler d1 execute $COD_DB_NAME --remote --file="$f" 2>&1 | tail -n 20 || echo "$f failed, continuing"
            fi
          done
          
          echo "=== Step 5: Final migrations apply to sync journal ==="
          npx wrangler d1 migrations apply $COD_DB_NAME --remote 2>&1 || true
          
          echo "=== Step 6: Final table check ==="
          npx wrangler d1 execute $COD_DB_NAME --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" 2>&1 | tail -n 100
          npx wrangler d1 execute $COD_DB_NAME --remote --command "SELECT count(*) as migrations FROM d1_migrations;" 2>&1 | tail -n 20 || true

      - name: Seed D1 Remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STORE_API_KEY: ${{ env.STORE_API_KEY }}
        run: |
          cd cod-server
          export COD_DB_NAME=${{ env.PROJECT }}-db
          echo "Seeding with STORE_API_KEY"
          npm run db:seed:remote 2>&1 || echo "Seed failed, trying direct insert"
          # Verify
          npx wrangler d1 execute $COD_DB_NAME --remote --command "SELECT count(*) as products FROM products; SELECT count(*) as categories FROM product_categories;" 2>&1 | tail -n 20

      - name: Seed Admin Remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cod-client-astro
          export COD_DB_NAME=${{ env.PROJECT }}-db
          ADMIN_EMAIL=admin@example.com ADMIN_NAME=Admin npm run seed:admin:remote 2>&1 || true
          cd ../cod-server
          npx wrangler d1 execute ${{ env.PROJECT }}-db --remote --command "SELECT email, role FROM users LIMIT 5;" 2>&1 | tail -n 20

      - name: Deploy cod-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cod-server
          npx wrangler deploy
          echo "Setting secrets..."
          printf "${{ env.BETTER_AUTH_SECRET }}" | npx wrangler secret put BETTER_AUTH_SECRET
          printf "${{ env.MCP_LOGIN_TICKET_SECRET }}" | npx wrangler secret put MCP_LOGIN_TICKET_SECRET
          printf "${{ env.STORE_API_KEY }}" | npx wrangler secret put STORE_API_KEY || true
          echo "cod-server deployed"

      - name: Deploy cod-client-astro
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cod-client-astro
          # Update PUBLIC_API_URL to point to deployed server
          echo "PUBLIC_API_URL=\"https://${{ env.PROJECT }}-server.workers.dev\"" > .env
          cat .env
          # Update wrangler.toml vars for production
          sed -i "s|https://api.example.com|https://${{ env.PROJECT }}-server.workers.dev|g" wrangler.toml || true
          sed -i "s|https://dashboard.example.com|https://${{ env.PROJECT }}-dashboard.workers.dev|g" wrangler.toml || true
          npx wrangler deploy
          printf "${{ env.BETTER_AUTH_SECRET }}" | npx wrangler secret put BETTER_AUTH_SECRET
          printf "${{ env.MCP_LOGIN_TICKET_SECRET }}" | npx wrangler secret put MCP_LOGIN_TICKET_SECRET
          echo "dashboard deployed"

      - name: Deploy theme01
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STORE_API_KEY: ${{ env.STORE_API_KEY }}
        run: |
          cd cod-astro/theme01
          echo "COD_SERVER_URL=https://${{ env.PROJECT }}-server.workers.dev" > .dev.vars
          echo "STORE_API_KEY=${{ env.STORE_API_KEY }}" >> .dev.vars
          cat .dev.vars
          # Update root .env for deploy script
          echo "COD_SERVER_URL=https://${{ env.PROJECT }}-server.workers.dev" > ../../.env
          echo "COD_DB_NAME=${{ env.PROJECT }}-db" >> ../../.env
          echo "COD_R2_BUCKET_NAME=${{ env.PROJECT }}-images" >> ../../.env
          npx wrangler deploy || npm run deploy || true
          printf "${{ env.STORE_API_KEY }}" | npx wrangler secret put STORE_API_KEY || true
          echo "theme01 deployed"

      - name: Smoke Tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== Smoke Tests ==="
          API_URL="https://${{ env.PROJECT }}-server.workers.dev"
          DASH_URL="https://${{ env.PROJECT }}-dashboard.workers.dev"
          STORE_URL="https://${{ env.PROJECT }}-os-theme01.workers.dev"
          echo "API: $API_URL"
          echo "Dashboard: $DASH_URL"
          echo "Store: $STORE_URL"
          sleep 10
          curl -s -o /dev/null -w "%{http_code}" $API_URL/api/docs || true
          echo ""
          curl -s $API_URL/api/docs | head -n 20 || true

      - name: Summary
        run: |
          echo "=== Deployment Complete ==="
          echo "Project: ${{ env.PROJECT }}"
          echo "API: https://${{ env.PROJECT }}-server.workers.dev"
          echo "Dashboard: https://${{ env.PROJECT }}-dashboard.workers.dev"
          echo "Storefront: https://${{ env.PROJECT }}-os-theme01.workers.dev"
          echo ""
          echo "Admin: admin@example.com (check seed:admin:remote logs for password)"
          echo "STORE_API_KEY: ${{ env.STORE_API_KEY }} (masked)"
          echo ""
          echo "If dashboard login fails with 403 INVALID_ORIGIN, update PUBLIC_TRUSTED_ORIGINS in cod-client-astro/wrangler.toml and redeploy"
